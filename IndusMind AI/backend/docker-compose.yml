version: "3.8"

services:
  fastapi-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=IndusMind FastAPI Enterprise Service
      - SECRET_KEY=super-secret-key-change-in-production-32-bytes
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
